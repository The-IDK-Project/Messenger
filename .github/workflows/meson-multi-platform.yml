name: Meson Multi-Platform Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: release

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip ninja-build \
          libcurl4-openssl-dev libjsoncpp-dev \
          sqlite3 libsqlite3-dev \
          libncurses5-dev libncursesw5-dev \
          qt6-base-dev
        pip3 install meson

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install meson ninja pkg-config curl jsoncpp sqlite3 ncurses qt6

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install meson ninja
        vcpkg install curl jsoncpp sqlite3 qt6-base

    - name: Configure Meson (Windows)
      if: runner.os == 'Windows'
      run: |
        meson setup build --buildtype=${{ env.BUILD_TYPE }} `
          --vsenv `
          --native-file vcpkg.txt
      shell: pwsh

    - name: Configure Meson (Unix)
      if: runner.os != 'Windows'
      run: |
        meson setup build --buildtype=${{ env.BUILD_TYPE }}

    - name: Build
      run: meson compile -C build

    - name: Run tests
      run: |
        meson test -C build --print-errorlogs

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: unified-messenger-${{ runner.os }}
        path: build/
