[application]
name = Messenger
version = 1.0.0
language = en
theme = dark
enable_notifications = true
notification_sound = notification.wav
message_sound = message.wav

[database]
type = sqlite
path = ~/.unified_messenger/messenger.db
backup_enabled = true
backup_interval = 24

[logging]
level = info
file_path = ~/.unified_messenger/logs/app.log
max_size = 10485760
max_files = 5

[network]
timeout = 30
retry_attempts = 3
proxy_enabled = false