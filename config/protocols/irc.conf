[connection]
default_port = 6667
ssl_port = 6697
use_sasl = true
auto_reconnect = true
reconnect_delay = 10

[behavior]
auto_join_channels = true
rejoin_on_kick = true
show_join_part_messages = true
show_server_messages = true

[identity]
real_name = Unified Messenger User
user_name = unified_user
nick_alternatives = unified_user_,unified_user__

[limits]
message_rate = 5
channel_limit = 50